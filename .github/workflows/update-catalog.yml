name: Sincronización Automática de Catálogo

on:
  # Ejecución programada: todos los lunes a las 06:00 AM UTC
  schedule:
    - cron: '0 6 * * 1'
  # Disparador manual para ejecutarlo con 1 clic desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar APIs y Actualizar Precios
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pipeline de sincronización
        run: pnpm sync-catalog

      - name: Revisar precios sospechosos antes de publicar
        # Google Shopping devuelve a veces otro artículo o otra unidad (un
        # «iPhone» suizo a 501 CHF). Este paso compara los precios que trae esa
        # fuente con el precio español convertido y devuelve a «convertido» los
        # que se salen de la banda, para que no lleguen a publicarse.
        run: python3 scripts/revisar-precios-sospechosos.py --aplicar

      - name: Verificar tests unitarios
        run: pnpm test

      - name: Comprobar cambios y publicar commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain src/data/products.json scripts/data/)" ]; then
            echo "Cambios detectados en el catálogo. Guardando commit..."
            git add src/data/products.json scripts/data/
            # SIN [skip ci]: esa etiqueta NO salta solo este workflow (que únicamente
            # corre por horario o a mano), pero Cloudflare Pages la interpreta como
            # "no construyas" y deja el despliegue en cola para siempre. Fue la causa
            # de que la web sirviera un mes de datos viejos entre septiembre y octubre.
            git commit -m "chore(catalog): sincronización automática de cotizaciones"
            git push
            echo "✔ Cambios publicados en master. Cloudflare Pages redesplegará automáticamente."
          else
            echo "Sin cambios en el catálogo en esta ejecución."
          fi
